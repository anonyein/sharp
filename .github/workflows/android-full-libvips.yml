name: sharp Android Full libvips Build

# Builds a fuller-format libvips for Android FROM SOURCE via MobiPkg/Compile,
# then cross-compiles sharp against it.
#
# Why MobiPkg instead of Conan Center:
#   The hard part of an Android libvips is cross-compiling glib (Conan's glib
#   recipe is not Android-ready: missing iconv wiring + Bionic pthread_*_np
#   gaps). MobiPkg/Compile already solves glib-on-Android and is exactly what
#   the CaiJingLong prebuilt used. Its default config is a "web" build though
#   (JPEG/PNG/WebP only, and -Dcplusplus=false, so NO libvips-cpp that sharp
#   needs). We patch its config to:
#     * enable -Dcplusplus=true   -> produces libvips-cpp (removes the need to
#       hand-compile the C++ binding ourselves)
#     * enable extra raster formats (phase 1: TIFF; more via IV_FORMATS)
#
# Constraint: MobiPkg's own android.sh documents that x86/x86_64 break due to
# libffi assembly vs the NDK, so this path is ARM-only (arm64-v8a, armeabi-v7a).
# If you need x86_64, keep using the web-only prebuilt workflow.
#
# Pipeline per ABI:
#   1. MobiPkg builds glib + libvips (+cpp) + format deps for the Android target.
#   2. sharp's N-API layer is cross-compiled against that libvips via pkg-config
#      (SHARP_FORCE_GLOBAL_LIBVIPS=1), also linked to the Javet Node runtime .so
#      for napi_* symbols (resolved at link time with --no-undefined).
#   3. jniLibs/<abi>/ bundles sharp.node + libvips + every dependency .so.

on:
  workflow_dispatch:
    inputs:
      sharp_ref:
        description: 'sharp git tag to build'
        required: false
        default: 'v0.33.5'
      node_version:
        description: 'Node.js version (headers)'
        required: false
        default: '24.18.0'
      formats:
        description: 'Comma list of extra libvips formats (tiff,heif,openjpeg,lcms,exif)'
        required: false
        default: 'tiff'
  push:
    tags: ['full-*']

permissions:
  contents: write

env:
  SHARP_REF: ${{ github.event.inputs.sharp_ref || 'v0.33.5' }}
  NODE_VERSION: ${{ github.event.inputs.node_version || '24.18.0' }}
  IV_FORMATS: ${{ github.event.inputs.formats || 'tiff' }}
  NDK_VERSION: r25c
  ANDROID_API: '24'
  MOBIPKG_REPO: https://github.com/MobiPkg/Compile.git
  JAVET_SO: libjavet-node-android-i18n.v.5.0.10.so
  JAVET_SO_ZIP_URL: https://raw.githubusercontent.com/anonyein/isolated-vm/main/libjavet-node-android-i18n.v.5.0.10.zip

jobs:
  full-build:
    name: sharp full-libvips .node for ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android
            gyp_arch: arm64
          - abi: x86_64
            triple: x86_64-linux-android
            gyp_arch: x64
    steps:
      - name: Checkout workflow repo (patch script)
        uses: actions/checkout@v4
        with:
          path: wf

      - name: Checkout sharp ${{ env.SHARP_REF }}
        uses: actions/checkout@v4
        with:
          repository: lovell/sharp
          ref: ${{ env.SHARP_REF }}
          path: sharp

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Dart (for MobiPkg/Compile)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 2.19.6

      - name: Install build tools
        run: |
          set -eux
          sudo apt-get update -y
          sudo apt-get install -y pkg-config xz-utils ninja-build cmake automake autoconf libtool gettext autopoint
          python3 -m pip install meson pyyaml
          npm install --global node-gyp@latest

      - name: Setup Android NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          local-cache: false

      - name: Fetch Node.js headers
        run: node-gyp install ${{ env.NODE_VERSION }}

      - name: Clone MobiPkg/Compile
        run: |
          set -eux
          git clone --depth=1 "${{ env.MOBIPKG_REPO }}" mobipkg
          cd mobipkg
          dart pub get

      - name: Patch MobiPkg libvips config (cplusplus + formats)
        env:
          IV_FORMATS: ${{ env.IV_FORMATS }}
        run: |
          set -eux
          python3 wf/.github/workflows/_patch-mobipkg-libvips.py \
            "$PWD/mobipkg/example/libvips"
          echo "--- workspace.yaml ---"
          cat mobipkg/example/libvips/workspace.yaml
          echo "--- libvips/lib.yaml options ---"
          grep -E '^\s*-\s*-D' mobipkg/example/libvips/libvips/lib.yaml

      - name: Build libvips (+cpp +formats) for ${{ matrix.abi }}
        id: vips
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -eux
          cd mobipkg
          INSTALL="$PWD/example/libvips/install"
          ARCH_PREFIX="$INSTALL/android/${{ matrix.abi }}"
          mkdir -p "$ARCH_PREFIX/bin" "$ARCH_PREFIX/lib/pkgconfig"
          # MobiPkg builds deps (glib, etc.) then libvips in one pass, but does
          # NOT wire prior deps' bin/ + pkgconfig/ into the later libvips meson
          # setup. libvips needs glib's host tools (glib-mkenums / glib-genmarshal)
          # and glib-2.0.pc. glib installs them into <prefix>/bin and
          # <prefix>/lib/pkgconfig, so pre-seed PATH + PKG_CONFIG_PATH to point
          # there for the whole build.
          export PATH="$ARCH_PREFIX/bin:$PATH"
          export PKG_CONFIG_PATH="$ARCH_PREFIX/lib/pkgconfig:$ARCH_PREFIX/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          # ARM-only per MobiPkg's android.sh (x86 breaks on libffi asm).
          dart run bin/compile.dart workspace \
            -C example/libvips \
            --no-ios --android \
            --android-cpu ${{ matrix.abi }} \
            --install-prefix "$INSTALL" \
            --dependency-prefix "$INSTALL" \
            --target libvips
          echo "install=$INSTALL" >> "$GITHUB_OUTPUT"
          echo "--- built tree (dirs) ---"
          find "$INSTALL" -maxdepth 4 -type d | sort | head -80
          echo "--- all .so under install ---"
          find "$INSTALL" -name '*.so*' | sort
          echo "--- all .pc under install ---"
          find "$INSTALL" -name '*.pc' | sort

      - name: Locate libvips staging for ${{ matrix.abi }}
        id: stage
        run: |
          set -eux
          INSTALL="${{ steps.vips.outputs.install }}"
          # MobiPkg may install libvips as libvips.so or a versioned libvips.so.42,
          # and under a per-arch subdir. Match loosely on the real payload name.
          libvips_so="$(find "$INSTALL" -type f \( -name 'libvips.so' -o -name 'libvips.so.*' \) | head -n1)"
          if [ -z "$libvips_so" ]; then
            echo "::error::libvips shared library not found under $INSTALL"
            echo "--- full file listing for diagnosis ---"
            find "$INSTALL" -type f | sort
            exit 1
          fi
          LIBDIR="$(dirname "$libvips_so")"
          ROOT="$(dirname "$LIBDIR")"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "libdir=$LIBDIR" >> "$GITHUB_OUTPUT"
          echo "--- libvips found at: $libvips_so ---"
          echo "--- .so in libdir ---"
          ls -lh "$LIBDIR"/*.so* 2>/dev/null || true
          echo "--- libvips-cpp present? ---"
          find "$ROOT" \( -name 'libvips-cpp.so*' -o -name 'libvips-cpp*.so' \) | head || true
          echo "--- pkgconfig ---"
          find "$ROOT" -name '*.pc' | head -30

      - name: Ensure pkg-config can resolve vips-cpp
        id: pc
        run: |
          set -eux
          ROOT="${{ steps.stage.outputs.root }}"
          LIBDIR="${{ steps.stage.outputs.libdir }}"
          PCDIR="$(find "$ROOT" -type d -name pkgconfig | head -n1)"
          if [ -z "$PCDIR" ]; then
            PCDIR="$LIBDIR/pkgconfig"
            mkdir -p "$PCDIR"
          fi
          # If vips-cpp.pc is missing (older builds), synthesize minimal ones.
          if [ ! -f "$PCDIR/vips-cpp.pc" ]; then
            INC="$(find "$ROOT" -type d -name vips | head -n1)"
            INC_ROOT="$(dirname "$INC")"
            {
              echo "prefix=$ROOT"
              echo "libdir=$LIBDIR"
              echo "includedir=$INC_ROOT"
              echo "Name: vips-cpp"
              echo "Description: libvips C++ binding"
              echo "Version: 8.16.0"
              echo "Libs: -L$LIBDIR -lvips-cpp -lvips"
              echo "Cflags: -I$INC_ROOT"
            } > "$PCDIR/vips-cpp.pc"
          fi
          echo "pcdir=$PCDIR" >> "$GITHUB_OUTPUT"
          PKG_CONFIG_PATH="$PCDIR" pkg-config --modversion vips-cpp || true
          PKG_CONFIG_PATH="$PCDIR" pkg-config --libs vips-cpp || true

      - name: Download & extract Javet runtime .so
        run: |
          set -eux
          curl -fL -o javet.zip "${{ env.JAVET_SO_ZIP_URL }}"
          unzip -o javet.zip -d javet
          test -f "javet/libs/${{ matrix.abi }}/${{ env.JAVET_SO }}"

      - name: Patch sharp binding.gyp for Android
        env:
          IV_ABI: ${{ matrix.abi }}
          IV_JAVET_SO: ${{ env.JAVET_SO }}
        run: python3 wf/.github/workflows/_patch-sharp-android.py "$PWD/sharp/src/binding.gyp"

      - name: Cross-compile & link sharp.node
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
          TRIPLE: ${{ matrix.triple }}
          ABI: ${{ matrix.abi }}
          API: ${{ env.ANDROID_API }}
          GYP_ARCH: ${{ matrix.gyp_arch }}
          SHARP_FORCE_GLOBAL_LIBVIPS: '1'
        run: |
          set -eux
          HOST_TAG=linux-x86_64
          TOOL="$NDK/toolchains/llvm/prebuilt/$HOST_TAG/bin"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/$HOST_TAG/sysroot"
          export CC="$TOOL/${TRIPLE}${API}-clang"
          export CXX="$TOOL/${TRIPLE}${API}-clang++"
          export AR="$TOOL/llvm-ar"
          export RANLIB="$TOOL/llvm-ranlib"
          export STRIP="$TOOL/llvm-strip"
          export LINK="$CXX"
          export CFLAGS="--sysroot=$SYSROOT -fPIC"
          export CXXFLAGS="--sysroot=$SYSROOT -fPIC"
          export LDFLAGS="--sysroot=$SYSROOT"

          export PKG_CONFIG_PATH="${{ steps.pc.outputs.pcdir }}"
          export IV_JAVET_LIB="$PWD/javet/libs/${{ matrix.abi }}/${{ env.JAVET_SO }}"

          pkg-config --modversion vips-cpp
          pkg-config --libs vips-cpp

          cd sharp
          npm install --ignore-scripts --no-audit --no-fund
          node-gyp configure --directory=src \
            --nodedir="$HOME/.cache/node-gyp/${NODE_VERSION}" \
            --arch="$GYP_ARCH"
          node-gyp build --directory=src --release \
            CC.target="$CC" CXX.target="$CXX" \
            CC.host="$CC" CXX.host="$CXX" \
            LINK.target="$CXX" AR.target="$AR"

      - name: Collect into jniLibs
        run: |
          set -eux
          LIBDIR="${{ steps.stage.outputs.libdir }}"
          DEST="$PWD/jniLibs/${{ matrix.abi }}"
          mkdir -p "$DEST"
          node_file="$(find sharp/src/build -name 'sharp*.node' | head -n1)"
          test -n "$node_file"
          cp -v "$node_file" "$DEST/sharp.node"
          # libvips + libvips-cpp + all dependency .so travel next to the addon
          cp -av "$LIBDIR/"*.so* "$DEST/" 2>/dev/null || true
          rm -rf "$DEST/pkgconfig"
          file "$DEST/sharp.node"
          echo "--- bundled .so ---"
          ls -lh "$DEST"

      - name: Upload per-abi artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharp-android-full-${{ matrix.abi }}
          path: jniLibs/${{ matrix.abi }}

  pack:
    name: Bundle jniLibs
    needs: full-build
    runs-on: ubuntu-latest
    steps:
      - name: Download per-abi artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sharp-android-full-*
          path: incoming
      - name: Assemble jniLibs
        run: |
          set -eux
          mkdir -p jniLibs
          for d in incoming/sharp-android-full-*; do
            abi="${d##*sharp-android-full-}"
            mkdir -p "jniLibs/$abi"
            cp -av "$d/." "jniLibs/$abi/"
          done
          find jniLibs -type f | sort
      - name: Zip
        run: zip -r "sharp-android-full-jniLibs-${{ env.SHARP_REF }}.zip" jniLibs
      - name: Upload merged artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharp-android-full-jniLibs
          path: sharp-android-full-jniLibs-${{ env.SHARP_REF }}.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sharp-android-full-jniLibs-*.zip
